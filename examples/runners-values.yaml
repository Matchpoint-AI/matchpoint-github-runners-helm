# Values file for Matchpoint Organization-level runners
# Deploy with: helm install arc-runners ./charts/github-actions-runners -f examples/runners-values.yaml

gha-runner-scale-set:
  # Controller service account configuration
  controllerServiceAccount:
    namespace: arc-systems
    name: arc-gha-rs-controller
  # Repo-level runner for matchpoint (repo scope PAT is sufficient; org-level needs admin:org)
  # To switch back to org-level, change URL to "https://github.com/Matchpoint-AI" and add admin:org scope to PAT
  githubConfigUrl: "https://github.com/Matchpoint-AI/matchpoint"
  runnerScaleSetName: "arc-beta-runners"  # GitHub label for runs-on (standardized per Issue #889)

  # Reference pre-defined secret with org-level PAT (created manually in cluster)
  # Secret must be created with: kubectl create secret generic arc-org-github-secret --namespace=arc-runners --from-literal=github_token='ghp_...'
  githubConfigSecret: arc-org-github-secret

  # Scaling configuration - tuned for capacity (Issues #152, #154)
  # Resource math: Each pod needs 1.5 CPU (runner: 1, dind: 0.5) + 6Gi memory
  # gp.vs1.large-iad nodes have 3.5 CPU / 15Gi allocatable → 2 runner pods per node
  # With 25 max nodes → 50 max concurrent runners
  minRunners: 2      # 2 warm runners; reduced from 5 to lower steady-state node cost
  maxRunners: 25     # Allow scaling to 25 for peak demand (Issue #154)

  # Security context for beta runners - removed to allow runner to work properly
  # securityContext:
  #   fsGroup: 123

  template:
    spec:
      # Allow 10 min for post-job cleanup (cache upload, artifact finalization).
      # Default 30s causes ARC to kill pods mid-upload → actions/cache failures.
      terminationGracePeriodSeconds: 600
      containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:latest
        imagePullPolicy: IfNotPresent  # Faster startup
        command:
        - /home/runner/run.sh
        env:
        # NOTE: ACTIONS_RUNNER_LABELS does not work with ARC
        # ARC only uses runnerScaleSetName as the GitHub label
        # See: https://docs.github.com/en/actions/hosting-your-own-runners/managing-self-hosted-runners-with-actions-runner-controller/using-actions-runner-controller-runners-in-a-workflow
        - name: RUNNER_NAME_PREFIX
          value: "arc-beta"
        - name: ACTIONS_RUNNER_REQUIRE_JOB_CONTAINER
          value: "false"
        - name: DOCKER_HOST
          value: "tcp://localhost:2375"
        - name: DOCKER_API_VERSION
          value: "1.43"  # Required: DinD v24 max API is 1.43, runner Docker client v29 uses 1.52
        - name: ACTIONS_RUNNER_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: NODE_OPTIONS
          value: "--max-old-space-size=10240"  # Increased for ARC performance (Issue #1522)
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: PIP_CACHE_DIR
          value: "/home/runner/_work/_pip-cache"
        resources:
          # Right-sized: 1 CPU + 0.5 dind = 1.5 CPU/pod → 2 pods/node on 3.5 allocatable
          requests:
            cpu: "1"        # Reduced from 2 for 2x pod density
            memory: 4Gi     # Reduced from 8Gi for 2x pod density
          limits:
            cpu: "3"        # Allow burst to 3 CPU
            memory: 10Gi
        volumeMounts:
        - name: work
          mountPath: /home/runner/_work
        - name: docker-certs
          mountPath: /certs/client
          readOnly: true
      - name: dind
        image: docker:24-dind
        command:
        - dockerd
        args:
        - --host=tcp://0.0.0.0:2375
        - --storage-driver=overlay2
        env:
        - name: DOCKER_TLS_CERTDIR
          value: ""
        resources:
          # DinD sidecar - right-sized for pod density
          requests:
            cpu: "500m"     # Reduced from 1 for 2x pod density
            memory: 2Gi     # Reduced from 3Gi
          limits:
            cpu: "2"        # Allow burst for heavy builds
            memory: 6Gi
        securityContext:
          privileged: true
        volumeMounts:
        - name: docker-storage
          mountPath: /var/lib/docker
        - name: docker-certs
          mountPath: /certs/client
      restartPolicy: Never
      volumes:
      - name: work
        emptyDir:
          sizeLimit: 25Gi
      - name: docker-storage
        emptyDir:
          sizeLimit: 20Gi
      - name: docker-certs
        emptyDir: {}
